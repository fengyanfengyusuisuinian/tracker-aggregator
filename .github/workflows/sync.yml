name: Sync Tracker

on:
  schedule:
    - cron: '0 5 * * *'  # 每天 13:00 北京时间 (UTC 05:00)
  workflow_dispatch:      # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main  # 明确检出 main 分支

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Check requirements.txt exists
        run: |
          if [ ! -f requirements.txt ]; then
            echo "错误：根目录未找到 requirements.txt 文件"
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tracker aggregation
        run: python main.py

      - name: Check for file changes
        run: |
          # 初始化无变化标志
          NO_CHANGES=false
          # 检查 TrackerServer/tracker.txt 是否与仓库中现有文件相同
          if [ -f TrackerServer/tracker.txt ] && [ -f $GITHUB_WORKSPACE/TrackerServer/tracker.txt ]; then
            if diff TrackerServer/tracker.txt $GITHUB_WORKSPACE/TrackerServer/tracker.txt > /dev/null; then
              echo "警告：TrackerServer/tracker.txt 没有变化"
              echo "更新无变化" > TrackerServer/无变化.txt
              NO_CHANGES=true
            else
              echo "TrackerServer/tracker.txt 已更新"
              rm -f TrackerServer/无变化.txt
            fi
          else
            echo "TrackerServer/tracker.txt 为新文件"
            rm -f TrackerServer/无变化.txt
          fi
          # 检查 TrackerServer/bad_tracker.txt 是否与仓库中现有文件相同
          if [ -f TrackerServer/bad_tracker.txt ] && [ -f $GITHUB_WORKSPACE/TrackerServer/bad_tracker.txt ]; then
            if diff TrackerServer/bad_tracker.txt $GITHUB_WORKSPACE/TrackerServer/bad_tracker.txt > /dev/null; then
              echo "警告：TrackerServer/bad_tracker.txt 没有变化"
              echo "更新无变化" >> TrackerServer/无变化.txt
              NO_CHANGES=true
            else
              echo "TrackerServer/bad_tracker.txt 已更新"
              rm -f TrackerServer/无变化.txt
            fi
          else
            if [ -f TrackerServer/bad_tracker.txt ]; then
              echo "TrackerServer/bad_tracker.txt 为新文件"
              rm -f TrackerServer/无变化.txt
            fi
          fi
          # 如果无变化，输出无变化.txt内容
          if [ "$NO_CHANGES" = true ] && [ -f TrackerServer/无变化.txt ]; then
            echo "以下文件没有变化："
            cat TrackerServer/无变化.txt
          fi

      - name: Commit and push tracker files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update tracker files'
          branch: main
          file_pattern: |
            TrackerServer/tracker.txt
            TrackerServer/bad_tracker.txt
            TrackerServer/无变化.txt
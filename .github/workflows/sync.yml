name: Sync Tracker
on:
  # 每天 13:00（北京时间）自动运行 → UTC 05:00
  schedule: 
    - cron: '0 5 * * *'
  # 允许在 Actions 页面手动点击运行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions: 
      contents: write  # workflow 有权写仓库内容

    steps:
      # 1️⃣ 检出仓库代码到 runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 设置 Python 环境
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3️⃣ 安装 Python 依赖
      - name: Install requests
        run: pip install requests

      # 4️⃣ 执行 Python 脚本，生成 TrackerServer/tracker.txt
      - name: Run Tracker aggregation
        run: python main.py

      # 5️⃣ 调试：显示 TrackerServer 文件夹内容，确认文件生成
      - name: List TrackerServer folder
        run: ls -l TrackerServer

      # 6️⃣ 强制 commit 文件，无论之前是否存在，确保提交到仓库
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update tracker.txt'
          commit_options: '--all'

      # 7️⃣ 打印提交 hash，用于日志确认
      - name: Show last commit hash
        run: git log -1 --pretty=format:"Commit hash: %H"

# main.py - 终极最终版：100% 干净 + 排序 + 必写 bad
import re
import socket
import urllib.parse
from pathlib import Path
from concurrent.futures import ThreadPoolExecutor
import requests

# ==================== 配置 ====================
SOURCES_FILE = "sources.list"
OUTPUT_DIR = Path("TrackerServer")
OUTPUT_DIR.mkdir(exist_ok=True)
VALID_FILE = OUTPUT_DIR / "tracker.txt"
BAD_FILE = OUTPUT_DIR / "bad_tracker.txt"

TIMEOUT = 7
MAX_WORKERS = 30
HEADERS = {"User-Agent": "qBittorrent/4.6.0"}

# 黑名单域名
BLACK_DOMAINS = {
    "cloudflare.com", "github.com", "pages.dev", "location.", "protocol",
    "nextchapter", "merca", "kitaujisub", "kuroy"
}

REQUIRE_KEYWORDS = ("announce", "scrape")

# 非法字符（JS、|、引号等）
ILLEGAL_PATTERN = re.compile(r"""[|;"'\\{}<>()[\]]|location\.|\+.*\+\s*['"]|nextChapterData|//.*//""")

# ==================== 工具函数 ====================
def is_clean_line(line: str) -> bool:
    line = line.lower()
    if any(kw in line for kw in ["javascript", "eval(", "document.", "window.", "location.", "nextchapter"]):
        return False
    return not ILLEGAL_PATTERN.search(line)

def extract_url(raw: str) -> tuple[str | None, str]:
    raw = raw.strip()
    if not raw or raw.startswith("#") or not is_clean_line(raw):
        return None, raw

    match = re.search(r"(udp://|https?://)[^|\s\"';,]+", raw)
    if not match:
        return None, raw

    url = match.group(0)
    url = re.sub(r"[,\s|;]+$", "", url)
    url = re.sub(r"\+(\d+)$", r"?passkey=\1", url)

    if ILLEGAL_PATTERN.search(url):
        return None, raw

    parsed = urllib.parse.urlparse(url)
    hostname = parsed.hostname or ""
    if any(bad in hostname for bad in BLACK_DOMAINS):
        return None, raw
    if len(parsed.path) < 5 or not any(kw in parsed.path.lower() for kw in REQUIRE_KEYWORDS):
        return None, raw

    comment = ""
    if "# " in raw:
        comment = " # " + raw.split("# ", 1)[1].split("#", 1)[0]
    return url, comment

def fetch(source_url: str):
    try:
        r = requests.get(source_url, headers=HEADERS, timeout=TIMEOUT)
        r.raise_for_status()
        return source_url, r.text.splitlines(), None
    except Exception as e:
        return source_url, [], f"ERROR: {e}"

def test_alive(url: str) -> bool:
    if url.startswith("udp://"):
        return True
    parsed = urllib.parse.urlparse(url)
    host = parsed.hostname
    port = parsed.port or (80 if parsed.scheme == "http" else 443)
    try:
        with socket.create_connection((host, port), timeout=3):
            return True
    except:
        return False

# ==================== 主逻辑 ====================
def main():
    if not Path(SOURCES_FILE).exists():
        print("sources.list not found!")
        return

    # 读取源
    with open(SOURCES_FILE, "r", encoding="utf-8") as f:
        lines = f.readlines()

    source_urls = [l.strip() for l in lines if l.strip().startswith(("http://", "https://"))]

    print(f"Fetching {len(source_urls)} sources...")
    results = []
    with ThreadPoolExecutor(max_workers=MAX_WORKERS) as pool:
        results = list(pool.map(fetch, source_urls))

    trackers = {}
    bad_sources = []

    for src, lines, err in results:
        if err:
            bad_sources.append(f"{src}  # {err}")
            continue
        for line in lines:
            url, comment = extract_url(line)
            if url and url not in trackers:
                trackers[url] = url + comment

    print(f"Found {len(trackers)} unique trackers, testing...")

    # 并行验证
    valid = []
    invalid = []

    with ThreadPoolExecutor(max_workers=MAX_WORKERS) as pool:
        for url in trackers:
            line = trackers[url]
            alive = test_alive(url)
            if alive:
                valid.append(line)
            else:
                invalid.append(line)

    # 新增：排序功能（字母顺序）
    valid.sort(key=lambda x: x.lower())
    invalid.sort(key=lambda x: x.lower())

    # 写入文件
    with open(VALID_FILE, "w", encoding="utf-8") as f:
        f.write("\n".join(valid) + "\n")

    with open(BAD_FILE, "w", encoding="utf-8") as f:
        content = invalid
        if bad_sources:
            if content:
                content.append("")
            content.extend(bad_sources)
        f.write("\n".join(content) + "\n")

    print(f"Done! {len(valid)} valid, {len(invalid)} invalid, sorted alphabetically")

if __name__ == "__main__":
    main()
name: Sync Tracker

on:
  schedule:
    - cron: '0 5 * * *'   # 早 05:00（北京时间 13:00）
    - cron: '0 13 * * *'  # 中 13:00（北京时间 21:00）
    - cron: '0 21 * * *'  # 晚 21:00（次日 05:00）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Tracker aggregation
        run: python main.py

      # 关键：强制提交所有新增 txt（含子目录）
      - name: 强制提交所有 txt（含新增）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A                      # 跟踪所有新增/修改
          git diff --cached --quiet && exit 0  # 无变化就跳过
          git commit -m "chore: update tracker files"
          git push

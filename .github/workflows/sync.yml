name: Sync Tracker          # ← 保持你原来的名字

on:
  schedule:
    - cron: '0 5 * * *'     # 北京时间 13:00 (UTC 5:00)
  workflow_dispatch:        # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 确保写权限（修复常见权限问题）

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 加 token 增强权限

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          pip install -U pip
          pip install -r requirements.txt
        # 加容错：如果失败，继续执行（可选）
        continue-on-error: true  # 临时测试用，后移除

      - name: Run aggregation
        run: python main.py
        continue-on-error: true  # 临时测试

      - name: Commit & push
        if: always()  # 即使失败也尝试 commit（日志有用）
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update tracker files'
          branch: main
          file_pattern: |
            TrackerServer/tracker.txt
            TrackerServer/bad_tracker.txt
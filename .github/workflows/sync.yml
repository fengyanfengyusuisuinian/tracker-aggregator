name: Sync Tracker

on:
  schedule:
    - cron: '0 5 * * *'   # UTC 05:00 = 北京时间 13:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc python3-dev

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Run aggregation
        run: python main.py

      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update tracker files'
          branch: main
          file_pattern: |
            TrackerServer/tracker.txt
            TrackerServer/bad_tracker.txt

name: Sync Tracker          # ← 保持你原来的名字

on:
  schedule:
    - cron: '0 5 * * *'     # 北京时间 13:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 3.11 镜像自带 websocket-client 二进制 wheel
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Run aggregation
        run: python main.py

      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update tracker files'
          branch: main
          file_pattern: |
            TrackerServer/tracker.txt
            TrackerServer/bad_tracker.txt

name: Sync Tracker

on:
  schedule:
    - cron: '0 5 * * *'  # 每天 13:00 北京时间
  workflow_dispatch:      # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # 检出仓库代码

      - name: Setup Python 3.12
        uses: actions/setup-python@v5  # 设置 Python 环境
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4  # 缓存 pip 依赖
        with:
          path: ~/.cache/pip  # 缓存 pip 下载的包
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}  # 基于 requirements.txt 生成缓存键
          restore-keys: |
            ${{ runner.os }}-pip-  # 回退键，匹配部分缓存

      - name: Install dependencies
        run: pip install -r requirements.txt  # 安装 requirements.txt 中的依赖

      - name: Run Tracker aggregation
        run: python main.py  # 运行主脚本

      - name: Commit and push tracker files
        uses: stefanzweifel/git-auto-commit-action@v5  # 提交输出文件
        with:
          commit_message: 'chore: update tracker files'
          file_pattern: |
            TrackerServer/tracker.txt
            TrackerServer/bad_tracker.txt
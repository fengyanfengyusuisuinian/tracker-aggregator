name: Sync Tracker

on:
  schedule:
    - cron: '0 5 * * *'  # 每天 13:00 北京时间 (UTC 05:00)
  workflow_dispatch:      # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main  # 明确检出 main 分支

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install requests

      - name: Run Tracker aggregation
        run: python main.py

      - name: Commit and push tracker files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update tracker files'
          branch: main
          file_pattern: |
            TrackerServer/tracker.txt
            TrackerServer/bad_tracker.txt